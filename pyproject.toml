[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-lab"
version = "0.1.0"
description = "Self-hosted LLM inference benchmarking and optimization lab: vLLM serving, custom load-testing harness, quality evals, and an OpenAI-compatible gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yan Li" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[tool.setuptools.packages.find]
include = ["inference_lab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
